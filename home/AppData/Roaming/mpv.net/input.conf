
# Volume
UP              add volume 5
DOWN            add volume -5

# Seek
LEFT            seek -5
RIGHT           seek 5
SHIFT+LEFT      seek -30
SHIFT+RIGHT     seek 30

# Playback
# Tap SPACE = pause/play, hold SPACE = 2x speed.
# SPACE is bound by scripts/hold-space-2x.lua (remap: KEY script-binding hold_space_2x/space-hold-2x)
f               cycle fullscreen
m               cycle mute

# Speed
]               add speed 0.25
[               add speed -0.25
BS       set speed 1.0

# Subtitle
v               cycle sub-visibility
j               cycle sub
MBTN_Right script-message-to mpvnet show-menu
